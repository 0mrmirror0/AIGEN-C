    const fromB64=value=>Uint8Array.from(atob(value),character=>character.charCodeAt(0));
    document.getElementById('gate').addEventListener('submit',async event=>{
      event.preventDefault();
      const submit=document.getElementById('submit');
      const error=document.getElementById('error');
      submit.disabled=true;error.textContent='';
      try{
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);

        document.open();document.write(new TextDecoder().decode(decrypted));document.close();
      }catch(_){error.textContent='Password non corretta.';submit.disabled=false;document.getElementById('password').select()}
