<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Amazon rare books AI training preview</title>
  <desc id="desc">AIGEN-C style preview for rare books being destroyed to train AI models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061a39"/>
      <stop offset="1" stop-color="#020916"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1b6eff" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <rect x="36" y="36" width="888" height="528" fill="none" stroke="#f6ad16" stroke-width="8"/>
  <g font-family="Menlo, Consolas, monospace" font-weight="900">
    <text x="72" y="112" fill="#00b8ff" font-size="34" letter-spacing="3">AI TRAINING DATA</text>
    <text x="72" y="222" fill="#f6ad16" font-size="78">AMAZON</text>
