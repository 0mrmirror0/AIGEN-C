    <path d="M585 188h184c48 0 88 39 88 88v118c0 48-40 88-88 88H585z" fill="#061a39" stroke="#1b6eff" stroke-width="8"/>
    <path d="M585 188c34 30 52 62 52 100v194c-18-28-34-42-52-48z" fill="#020916" stroke="#1b6eff" stroke-width="8"/>
    <path d="M666 248h128M666 292h128M666 336h92" stroke="#bad0ff" stroke-width="12"/>
    <path d="M560 156l320 360" stroke="#d92d20" stroke-width="18"/>
    <path d="M700 126v64M700 482v64M588 242h-64M876 358h-64" stroke="#f6ad16" stroke-width="10"/>
    <circle cx="700" cy="336" r="112" stroke="#00b8ff" stroke-width="10" stroke-dasharray="24 18"/>
