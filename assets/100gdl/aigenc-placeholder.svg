  </g>
  <g font-family="Menlo, Consolas, monospace" font-weight="900">
    <text x="370" y="212" fill="#f6ad16" font-size="72">AIGEN-C</text>
    <text x="372" y="284" fill="#f5f8ff" font-size="42">LINK PREVIEW</text>
    <text x="372" y="352" fill="#bad0ff" font-size="30">immagine neutra per la scaletta</text>
    <text x="372" y="400" fill="#00b8ff" font-size="28">we talk to your machines</text>
