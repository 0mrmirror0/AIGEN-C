<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft OpenAI revenue preview</title>
  <desc id="desc">AIGEN-C style preview for Microsoft AI revenue concentration around OpenAI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061a39"/>
      <stop offset="1" stop-color="#020916"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1b6eff" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <rect x="36" y="36" width="888" height="528" fill="none" stroke="#f6ad16" stroke-width="8"/>
  <g font-family="Menlo, Consolas, monospace" font-weight="900">
    <text x="72" y="110" fill="#00b8ff" font-size="34" letter-spacing="3">BIG TECH AI</text>
    <text x="72" y="245" fill="#f6ad16" font-size="118">70%</text>
    <text x="72" y="322" fill="#f5f8ff" font-size="48">AI REVENUE</text>
    <text x="72" y="504" fill="#bad0ff" font-size="32">one customer: OpenAI</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="584" y="170" width="110" height="110" stroke="#00b8ff" stroke-width="12"/>
    <rect x="724" y="170" width="110" height="110" stroke="#00b8ff" stroke-width="12"/>
    <rect x="584" y="310" width="110" height="110" stroke="#00b8ff" stroke-width="12"/>
    <rect x="724" y="310" width="110" height="110" stroke="#f6ad16" stroke-width="12"/>
    <path d="M548 455h322" stroke="#bad0ff" stroke-width="10"/>
    <path d="M766 365l78 88" stroke="#f6ad16" stroke-width="14"/>
  </g>
</svg>
